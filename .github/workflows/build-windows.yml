name: Build Aksir for Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      QT_VERSION: 6.8.2
      QT_ARCH: win64_msvc2022_64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        arch: ${{ env.QT_ARCH }}
        cache: true

    - name: Configure CMake
      run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Deploy Qt dependencies
      run: windeployqt --release --no-translations build/Aksir.exe

    - name: Zip artifact
      shell: pwsh
      run: |
        $zipName = "Aksir-win-x64-${{ env.BUILD_TYPE }}.zip"
        Compress-Archive -Path "build/*" -DestinationPath $zipName -Force
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aksir-Windows-Build
        path: ${{ env.ZIP_NAME }}
